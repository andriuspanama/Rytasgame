<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVP Pac-Man & Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scanlines"></div>

    <div id="game-container">
        <!-- Pradžios ekranas -->
        <div id="start-screen" class="screen active">
            <h1 class="neon-text">MVP PAC-MAN</h1>
            <p>Valgyk taškus, ieškok specialių rutuliukų ir atsakinėk į klausimus!</p>
            <button onclick="startGame()">PRADĖTI ŽAIDIMĄ</button>
        </div>

        <!-- Žaidimo ekranas -->
        <div id="play-screen" class="screen">
            <div id="hud">
                <span id="score-display" class="neon-text">Taškai: 0</span>
                <span id="lives-display" class="neon-text-pink">Gyvybės: 3</span>
            </div>
            <canvas id="gameCanvas" width="570" height="630"></canvas>
            
            <!-- Mobiliems įrenginiams skirti mygtukai -->
            <div id="mobile-controls">
                <button onclick="setDirection('up')">▲</button>
                <div>
                    <button onclick="setDirection('left')">◀</button>
                    <button onclick="setDirection('down')">▼</button>
                    <button onclick="setDirection('right')">▶</button>
                </div>
            </div>
        </div>

        <!-- Viktorinos Ekranas (Iššoka žaidimo metu) -->
        <div id="quiz-overlay" class="overlay">
            <div class="quiz-box">
                <h2 id="quiz-timer-display" class="neon-text-pink">Laikas: 10s</h2>
                <h3 id="question-text">Klausimas...</h3>
                <div id="options-container"></div>
            </div>
        </div>

        <!-- Pabaigos Ekranas -->
        <div id="end-screen" class="screen">
            <h1 id="end-title" class="neon-text">Žaidimas Baigtas</h1>
            <h2 id="final-score" class="neon-text-pink">Taškai: 0</h2>
            <button onclick="location.reload()">BANDYTI IŠ NAUJO</button>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
